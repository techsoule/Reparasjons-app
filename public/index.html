<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reparasjons-app</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🔧</span>
      <div>
        <h1>Reparasjons-app</h1>
        <p class="subtitle">Fordel og følg opp reparasjoner</p>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="board">Tavle</button>
      <button class="tab" data-view="calendar">Kalender</button>
      <button class="tab" data-view="technicians">Teknikere</button>
      <button class="tab" id="logout-btn" title="Logg ut">Logg ut</button>
    </nav>
  </header>

  <section class="stats" id="stats"></section>

  <main>
    <!-- TAVLE -->
    <div id="view-board" class="view">
      <div class="toolbar">
        <button class="btn primary" id="new-repair-btn">+ Ny reparasjon</button>
        <button class="btn accent" id="distribute-btn">⚡ Fordel automatisk</button>
      </div>
      <div class="board" id="board"></div>
    </div>

    <!-- KALENDER -->
    <div id="view-calendar" class="view hidden">
      <div class="toolbar">
        <button class="btn ghost" id="cal-prev">←</button>
        <button class="btn ghost" id="cal-today">I dag</button>
        <button class="btn ghost" id="cal-next">→</button>
        <span class="cal-date" id="cal-date"></span>
      </div>
      <div class="cal" id="calendar"></div>
    </div>

    <!-- TEKNIKERE -->
    <div id="view-technicians" class="view hidden">
      <div class="toolbar">
        <button class="btn primary" id="new-tech-btn">+ Ny tekniker</button>
        <div class="notify-box">
          <label for="me-select">Jeg er:</label>
          <select id="me-select"></select>
          <button class="btn ghost" id="notify-btn">🔔 Aktiver varsler</button>
        </div>
      </div>
      <div class="tech-grid" id="tech-grid"></div>
    </div>
  </main>

  <!-- Modal for reparasjon -->
  <dialog id="repair-dialog">
    <form method="dialog" id="repair-form">
      <h2 id="repair-dialog-title">Ny reparasjon</h2>
      <input type="hidden" name="id" />
      <label>Kundenavn *<input name="customerName" required /></label>
      <label>Telefon<input name="phone" /></label>
      <label>Enhet<input name="device" placeholder="f.eks. iPhone 13, 128GB sort" /></label>
      <label>Kategori
        <select name="category" id="repair-category"></select>
      </label>
      <label>Problem<textarea name="problem" rows="3" placeholder="Beskriv feilen"></textarea></label>
      <div class="row2">
        <label>Pris (kr)<input name="price" type="number" min="0" step="10" value="690" /></label>
        <label>Varighet (min)<input name="durationMin" type="number" min="15" step="15" value="45" /></label>
      </div>
      <label>Prioritet
        <select name="priority" id="repair-priority"></select>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>Avbryt</button>
        <button type="submit" class="btn primary">Lagre</button>
      </div>
    </form>
  </dialog>

  <!-- Modal for tekniker -->
  <dialog id="tech-dialog">
    <form method="dialog" id="tech-form">
      <h2 id="tech-dialog-title">Ny tekniker</h2>
      <input type="hidden" name="id" />
      <label>Navn *<input name="name" required /></label>
      <label>Kapasitet (samtidige jobber)<input name="capacity" type="number" min="1" value="5" /></label>
      <div class="row2">
        <label>Arbeidstid fra<input name="workStart" type="time" value="09:00" /></label>
        <label>Arbeidstid til<input name="workEnd" type="time" value="16:00" /></label>
      </div>
      <p class="hint">Arbeidstiden kan endres hver mandag. Endringer gjort andre dager trer i kraft førstkommende mandag.</p>
      <fieldset>
        <legend>Spesialiteter (tom = generalist)</legend>
        <div id="specialties-box" class="chips"></div>
      </fieldset>
      <label class="checkbox"><input type="checkbox" name="active" checked /> Aktiv</label>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>Avbryt</button>
        <button type="submit" class="btn primary">Lagre</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
