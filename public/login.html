<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logg inn – Reparasjons-app</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --primary:#3b82f6; --red:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:32px; width:min(360px,92vw); box-shadow:0 8px 30px rgba(0,0,0,.35); }
    .logo { font-size:40px; text-align:center; }
    h1 { font-size:20px; text-align:center; margin:8px 0 4px; }
    p.sub { text-align:center; color:var(--muted); font-size:13px; margin:0 0 22px; }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
    input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:11px 12px; font-size:15px; }
    button { width:100%; margin-top:16px; background:var(--primary); color:#fff; border:none; border-radius:8px; padding:12px; font-size:15px; font-weight:600; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
    .err { color:var(--red); font-size:13px; margin-top:12px; text-align:center; min-height:18px; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <div class="logo">🔧</div>
    <h1>Reparasjons-app</h1>
    <p class="sub">Logg inn for å fortsette</p>
    <label for="pw">Passord</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus required />
    <button type="submit">Logg inn</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('pw').value }),
        });
        if (res.ok) { location.href = '/'; }
        else { err.textContent = 'Feil passord – prøv igjen.'; }
      } catch { err.textContent = 'Noe gikk galt. Prøv igjen.'; }
    });
  </script>
</body>
</html>
